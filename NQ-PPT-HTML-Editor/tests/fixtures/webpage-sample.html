<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<title>网页测试样本</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:sans-serif;background:#fff;color:#222;line-height:1.6}
  .container{max-width:800px;margin:0 auto;padding:40px 20px}
  h1{font-size:36px;margin-bottom:16px}
  .lead{font-size:17px;color:#666;margin-bottom:32px}
  .card{background:#f5f5f5;border-radius:8px;padding:24px;margin-bottom:16px}
  .card h2{font-size:20px;margin-bottom:8px}
  .card p{font-size:15px;color:#666;line-height:1.7}
</style></head>
<body>
<div class="container">
  <h1>文章标题</h1>
  <p class="lead">这是一段导语，介绍下面三张卡片。</p>
  <div class="card"><h2>卡片一</h2><p>这是卡片一的内容。可以选中、拖拽、改字号。</p></div>
  <div class="card"><h2>卡片二</h2><p>这是卡片二的内容。试试改它的颜色或宽度。</p></div>
  <div class="card"><h2>卡片三</h2><p>这是卡片三的内容。也可以复制或删除。</p></div>
</div>
</body></html>
