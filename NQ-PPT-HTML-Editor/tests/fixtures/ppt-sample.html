<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<title>PPT测试样本</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a1f3d;color:#f1f3f5;font-family:sans-serif}
  #deck{position:fixed;inset:0;width:10000vw;height:100vh;display:flex;transition:transform .9s cubic-bezier(.77,0,.175,1)}
  .slide{width:100vw;height:100vh;flex:0 0 100vw;padding:6vh 6vw;display:flex;flex-direction:column;justify-content:center;position:relative}
  .chrome{display:flex;justify-content:space-between;font-family:monospace;font-size:12px;opacity:.6;letter-spacing:.1em}
  .h-hero{font-family:serif;font-weight:900;font-size:7.5vw;line-height:1.05}
  .h-xl{font-family:serif;font-weight:700;font-size:6.2vw;line-height:1.1}
  .lead{font-size:2.2vw;opacity:.8;line-height:1.45;margin-top:2vh}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:4vw;flex:1;align-content:center;margin-top:4vh}
  .stat-card{display:flex;flex-direction:column;gap:1vh;padding-top:1.6vh;border-top:1px solid rgba(127,127,127,.3)}
  .stat-nb{font-size:5.8vw;font-weight:800;line-height:.9}
  .stat-note{font-size:1.2vw;opacity:.7;line-height:1.5}
  #nav{position:fixed;bottom:2vh;left:50%;transform:translateX(-50%);display:flex;gap:8px}
  #nav .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);border:0;cursor:pointer}
  #nav .dot.active{background:#fff}
</style></head>
<body>
<div id="deck">

<!-- P1 -->
<section class="slide">
  <div class="chrome"><div>测试 · Demo</div><div>01 / 03</div></div>
  <h1 class="h-hero" data-anim>封面标题</h1>
  <p class="lead" data-anim>这是一段引言文字，可以双击修改。</p>
  <div class="chrome" style="margin-top:auto"><div>Page 01</div><div>—</div></div>
</section>

<!-- P2 -->
<section class="slide">
  <div class="chrome"><div>数据 · Stats</div><div>02 / 03</div></div>
  <h2 class="h-xl">三个数字</h2>
  <div class="grid-3">
    <div class="stat-card"><div class="stat-nb">30</div><div class="stat-note">分钟</div></div>
    <div class="stat-card"><div class="stat-nb">3</div><div class="stat-note">秒</div></div>
    <div class="stat-card"><div class="stat-nb">10x</div><div class="stat-note">效率提升</div></div>
  </div>
  <div class="chrome" style="margin-top:auto"><div>Page 02</div><div>—</div></div>
</section>

<!-- P3 -->
<section class="slide">
  <div class="chrome"><div>结尾 · End</div><div>03 / 03</div></div>
  <h2 class="h-xl">第三页</h2>
  <p class="lead">结尾文字，可以改。</p>
  <div class="chrome" style="margin-top:auto"><div>Page 03</div><div>—</div></div>
</section>

</div>

<div id="nav"></div>
<script>
  var deck=document.getElementById('deck');
  var slides=deck.querySelectorAll('.slide');
  var nav=document.getElementById('nav');
  var idx=0;
  deck.style.width=(slides.length*100)+'vw';
  slides.forEach(function(s,i){var b=document.createElement('button');b.className='dot';b.onclick=function(){go(i)};nav.appendChild(b)});
  function go(n){idx=Math.max(0,Math.min(slides.length-1,n));deck.style.transform='translateX('+(-idx*100)+'vw)';nav.querySelectorAll('.dot').forEach(function(d,i){d.classList.toggle('active',i===idx)})}
  addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
  go(0);
</script>
</body></html>
