version: '2.1'
last_reviewed: '2026-09-17'
principle: Official regulator sources first; verify availability/status at runtime.
sources:
- id: fda_adverse_event_source_resolver
  jurisdiction: US
  authority: FDA
  purpose: adverse_event_source_resolution
  level: system_status
  public: true
  preferred: true
  url: https://www.fda.gov/medical-devices/medical-device-reporting-mdr-how-report-medical-device-problems/mdr-data-files
  notes:
  - Verify current AEMS/MAUDE/openFDA/MDR-download status at every run.
  - If the current primary interface cannot be queried, mark access_limited rather
    than zero_hit.
- id: fda_openfda_device_event
  jurisdiction: US
  authority: FDA
  purpose: adverse_event
  level: incident_report
  public: true
  preferred: runtime_fallback
  url: https://open.fda.gov/apis/device/event/
  notes:
  - Use only after runtime source-resolution check; FDA is transitioning device adverse-event
    data toward AEMS in 2026.
  - Machine-readable MAUDE route when current/appropriate; counts cannot be used as
    incidence rates without an exposure denominator.
  - One report may contain multiple problem codes.
- id: fda_openfda_device_recall
  jurisdiction: US
  authority: FDA
  purpose: recall
  level: recall_record
  public: true
  preferred: true
  url: https://open.fda.gov/apis/device/recall/
- id: fda_tplc
  jurisdiction: US
  authority: FDA
  purpose: class_overview
  level: product_code_aggregate
  public: true
  preferred: false
  url: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfTPLC/tplc.cfm
  notes:
  - Use as procode/device-class overview and cross-check, not as brand/model-specific
    evidence.
- id: fda_device_classification
  jurisdiction: US
  authority: FDA
  purpose: identity
  level: product_code
  public: true
  preferred: true
  url: https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfPCD/classification.cfm
- id: openfda_udi
  jurisdiction: US
  authority: FDA
  purpose: identity
  level: device_identifier
  public: true
  preferred: true
  url: https://open.fda.gov/apis/device/udi/
- id: eudamed
  jurisdiction: EU
  authority: European Commission
  purpose: identity_and_available_modules
  level: mixed
  public: true
  preferred: true
  url: https://health.ec.europa.eu/medical-devices-eudamed/overview_en
  notes:
  - Verify module status at runtime.
  - Do not assume a public EU-wide vigilance incident dataset exists.
- id: bfarm_safety_information
